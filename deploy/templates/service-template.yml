          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: msk-debug
              image: quay.io/redhat-services-prod/app-sre-tenant/container-images-master/msk-debug-container-master:3.7-1
              imagePullPolicy: Always
              command: ["/bin/sh", "-c", "sleep infinity"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: MSK_BOOTSTRAP_SERVERS
                  valueFrom:
                    secretKeyRef:
                      name: ${MSK_SECRET_NAME}
                      key: bootstrap_brokers_sasl_scram
                - name: MSK_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${MSK_CREDENTIALS_SECRET_NAME}
                      key: username
                - name: MSK_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${MSK_CREDENTIALS_SECRET_NAME}
                      key: password
                - name: MSK_CONFIG
                  value: "/client.properties"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
